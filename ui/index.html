<script>
'use strict';
const $=id=>document.getElementById(id);
let state=null,selected=null,lastPapers='',page='papers',lastVersion=-1,apiReady=false,polling=false;
const fields=['username','password','base_url','model','apikey','sleep_time'];
function config(){return {username:$('username').value,password:$('password').value,sleep_time:$('sleep_time').value,ai:{base_url:$('base_url').value,model:$('model').value,apikey:$('apikey').value}}}
function icon(name){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');const use=document.createElementNS(svg.namespaceURI,'use');use.setAttribute('href','#i-'+name);svg.append(use);return svg}
async function send(command){if(!apiReady)return;try{render(await window.pywebview.api.dispatch(command))}catch(e){$('statusText').textContent='本地服务连接中断，请重新启动程序。'}}
function navigate(value){send({action:'navigate',page:value})}
function switchPage(value){if(value===page)return;page=value;document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page-'+page));document.querySelectorAll('nav button').forEach(el=>{el.classList.toggle('active',el.dataset.page===page);el.setAttribute('aria-current',el.dataset.page===page?'page':'false')});$('heading').textContent={papers:'我的试卷',settings:'账号与模型',logs:'运行记录'}[page];$('subheading').textContent={papers:'选择一张试卷，开始本次任务',settings:'管理你的账号与模型服务',logs:'查看任务的实时进展与结果'}[page];$('refresh').hidden=page!=='papers';$('save').hidden=page!=='settings'}
function paperBlocked(paper){return (state.blocked_paper_ids||[]).includes(String(paper?.ksdId??''))}
function selectPaper(index){if(state.busy||state.completed||paperBlocked(state.papers[index]))return;selected=index;updateSelection();renderTask()}
function updateSelection(){if(selected!==null&&paperBlocked(state.papers[selected]))selected=null;document.querySelectorAll('.paper').forEach(el=>{el.classList.toggle('selected',Number(el.dataset.index)===selected);el.setAttribute('aria-pressed',Number(el.dataset.index)===selected?'true':'false')});const paper=selected===null?null:state.papers[selected];$('selection').textContent=paper?.ksName||'尚未选择试卷';$('selection').classList.toggle('muted',!paper);$('run').disabled=!paper||state.busy||state.completed;$('examCode').placeholder=paper?.examCodeFlag?'请输入考试码':'考试码（选填）'}
function renderPapers(){const signature=JSON.stringify(state.papers);if(signature!==lastPapers){lastPapers=signature;selected=null;$('cards').replaceChildren();state.papers.forEach((paper,index)=>{const button=document.createElement('button');button.className='paper';button.dataset.index=index;button.type='button';button.setAttribute('aria-pressed','false');const mark=document.createElement('span');mark.className='paper-icon';mark.append(icon('file'));const detail=document.createElement('span');detail.className='paper-detail';const title=document.createElement('span');title.className='paper-title';title.textContent=paper.ksName||'未命名试卷';title.title=title.textContent;const sub=document.createElement('span');sub.className='paper-sub';sub.textContent='编号 '+(paper.ksdId??'未提供');detail.append(title,sub);const badge=document.createElement('span');badge.className='badge';badge.textContent=paper.canKaoshiJudgeBean?.kaoshiBtnInfo||'我的考试';const radio=document.createElement('span');radio.className='radio';button.append(mark,detail,badge,radio);button.onclick=()=>selectPaper(index);$('cards').append(button)})}const loading=state.activity==='loading'&&!state.stopping&&!state.papers.length;$('skeleton').hidden=!loading;$('empty').hidden=loading||state.papers.length>0;$('toolbar').hidden=state.papers.length===0;$('count').textContent=state.papers.length+' 张试卷';$('emptyTitle').textContent=state.connected?'这里还没有试卷':'从一张试卷开始';$('emptyMessage').textContent=state.connected?'当前账号暂无可选试卷，可以稍后重新获取。':'连接账号后，选择你想处理的试卷。';document.querySelectorAll('.paper').forEach(el=>{el.hidden=!el.querySelector('.paper-title').textContent.toLowerCase().includes($('search').value.toLowerCase());el.disabled=state.busy||state.completed||paperBlocked(state.papers[Number(el.dataset.index)])});updateSelection()}
function render(value){if(value.version<=lastVersion)return;state=value;lastVersion=value.version;switchPage(value.page);renderPapers();renderTask();$('statusText').textContent=value.status;$('statusText').title=value.status;const loading=value.activity==='loading'&&!value.stopping;const working=value.busy&&!value.stopping;$('statusIcon').classList.toggle('spinner',working);$('statusIcon').querySelector('use').setAttribute('href',value.stopping?'#i-stop':working?'#i-refresh':'#i-check');$('refresh').disabled=value.busy;$('refresh').querySelector('svg').classList.toggle('spinner',loading);$('refresh').querySelector('span').textContent=loading?'获取中…':'获取试卷';$('emptyLoad').disabled=value.busy;$('save').disabled=value.busy;fields.forEach(id=>$(id).disabled=value.busy);$('examCode').disabled=value.busy;$('autoSubmit').disabled=value.busy;$('stop').disabled=!value.connected||value.stopping;$('progress').hidden=!working||Boolean(value.task);$('progress').classList.toggle('indeterminate',value.progress===null);$('progress').firstElementChild.style.width=value.progress===null?'25%':value.progress+'%';const logContent=$('logContent');const atBottom=logContent.scrollHeight-logContent.scrollTop-logContent.clientHeight<45;$('logs').textContent=value.logs.join('\n');$('logEmpty').hidden=value.logs.length>0;if(atBottom)logContent.scrollTop=logContent.scrollHeight;const notice=value.notice;$('notice').hidden=!notice;if(notice){$('notice').classList.toggle('error',notice.error);$('noticeMessage').textContent=notice.text;$('confirm').hidden=!notice.confirm;$('confirm').textContent=notice.label;$('dismiss').textContent=notice.confirm?'取消':'知道了'}}

function duration(seconds){seconds=Math.max(0,Math.floor(seconds));const m=Math.floor(seconds/60),v=seconds%60;return m>=60?Math.floor(m/60)+'小时'+m%60+'分':m+'分'+String(v).padStart(2,'0')+'秒'}
function taskClock(){const task=state?.task;if(!task)return;$('taskElapsed').textContent='已用时 '+duration((task.finished_at||Date.now()/1000)-task.started_at);let detail=task.detail;if(task.status==='running'&&task.submit_at){const left=Math.max(0,Math.ceil(task.submit_at-Date.now()/1000));detail=left?'核对完成，'+left+' 秒后自动交卷':'等待网站交卷确认…'}$('taskDetail').textContent=detail;$('taskDetail').title=detail}
function renderTask(){const task=state.task;const next=task?.status==='submitted'&&selected!==null&&!paperBlocked(state.papers[selected])&&!state.busy;document.querySelector('.dock').hidden=Boolean(task)&&!next;$('taskProgress').hidden=!task;if(!task)return;const states={running:'执行中',submitted:'已交卷',review:'待检查 · 未交卷',error:task.submitted?'已交卷 · 核对异常':'运行失败',stopped:'已停止'};$('taskProgress').className='task-card '+task.status+(next?' compact':'');$('taskName').textContent=task.paper_name;$('taskName').title=task.paper_name;$('taskState').textContent=state.stopping?'正在停止':states[task.status]||'执行中';const current=task.stages.find(item=>item.key===task.stage);let title=current.title;if(task.status==='submitted')title='交卷已确认';else if(task.status==='review')title='填写核对完成';else if(task.status==='error')title+=' · 已停止';else if(task.status==='stopped')title+=' · 已取消';else if(current.total&&['download','transcribe','generate','fill'].includes(current.key))title+=' '+current.done+'/'+current.total;$('taskStage').textContent=title;$('taskPercent').textContent=task.percent+'%';$('taskFill').style.width=task.percent+'%';$('taskBar').setAttribute('aria-valuenow',String(task.percent));$('taskBar').setAttribute('aria-valuetext',task.completed_steps+'/'+task.total_steps+' 个流程步骤完成');$('taskSteps').replaceChildren();task.stages.forEach(item=>{const step=document.createElement('div');step.className='task-step '+item.state;const title=document.createElement('div');title.className='step-title';const dot=document.createElement('span');dot.className='step-dot';title.append(dot,document.createTextNode(item.title));const count=document.createElement('span');count.className='step-count';count.textContent=item.state==='manual'?'手动交卷':item.total!==null?item.done+'/'+item.total+item.unit:item.state==='complete'?'已完成':item.state==='pending'?'等待中':'处理中';step.append(title,count);$('taskSteps').append(step)});taskClock()}

function load(){send({action:'load',config:config()})}
$('refresh').onclick=load;$('emptyLoad').onclick=load;$('save').onclick=()=>send({action:'save',config:config()});$('run').onclick=()=>send({action:'run',index:selected,exam_code:$('examCode').value,auto_submit:$('autoSubmit').checked,config:config()});$('stop').onclick=()=>send({action:'stop'});$('dismiss').onclick=()=>send({action:'dismiss'});$('confirm').onclick=()=>send({action:'confirm',id:state.notice?.id});$('search').oninput=()=>{if(state)renderPapers()};$('autoSubmit').onchange=()=>{$('modeHint').textContent=$('autoSubmit').checked?'填写完成后会自动交卷，开始前将再次核对试卷。':'默认只填写答案，完成后由你在浏览器中检查。'};document.querySelectorAll('nav button').forEach(el=>el.onclick=()=>navigate(el.dataset.page));
async function poll(){if(polling||!apiReady)return;polling=true;try{render(await window.pywebview.api.get_state())}catch(e){$('statusText').textContent='本地服务连接中断，请重新启动程序。'}finally{polling=false}}
async function boot(){if(apiReady)return;apiReady=true;try{const value=await window.pywebview.api.get_config();fields.forEach(id=>$(id).value=(id in value?value[id]:value.ai?.[id])??'');$('modelName').textContent=value.ai?.model||'听力助手';await poll();setInterval(poll,350);setInterval(taskClock,1000)}catch(e){$('statusText').textContent='启动失败，请重新启动程序。'}}
window.addEventListener('pywebviewready',boot);if(window.pywebview?.api)boot();
</script></body></html>
